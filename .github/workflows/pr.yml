name: Pull Request Check

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install
        working-directory: ./extensions/directus-extension-typograf

      - name: Build
        run: npm run build
        working-directory: ./extensions/directus-extension-typograf
